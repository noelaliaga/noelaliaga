<svg xmlns="http://www.w3.org/2000/svg" width="400" height="214" viewBox="0 0 400 214" role="img" aria-labelledby="t d"><title id="t">About: I have spent five years as a production lead in a factory, after working in a warehouse. That is where my approach to systems comes from: clear responsibilities, controlled changes, useful checks and a plan for when something fails. Now I design and build AI agent systems with the same rules.</title><desc id="d">About: I have spent five years as a production lead in a factory, after working in a warehouse. That is where my approach to systems comes from: clear responsibilities, controlled changes, useful checks and a plan for when something fails. Now I design and build AI agent systems with the same rules.</desc><style>.u{animation:u .5s cubic-bezier(.2,.8,.2,1) both}
